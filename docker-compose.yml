version: "3.9"

services:
  webserver:
    build:
      context: ./bin/${PHPVERSION}
    # quito container_name para evitar choques; Docker compone el nombre con la carpeta + servicio
    restart: "always"
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
      - "5173:5173"   # si usas Vite; si no, quítalo
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${SSL_DIR-./config/ssl}:/etc/apache2/ssl/
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${APACHE_LOG_DIR-./logs/apache2}:/var/log/apache2    # <-- alineado con tu .env
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      # Mejor vacío mientras no depures (menos overhead):
      XDEBUG_CONFIG: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    external: true
    name: red_mysql_local
